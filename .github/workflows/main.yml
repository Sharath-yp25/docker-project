name: Integrating docker with Github actions
on:
  workflow_dispatch:
      branches: [ "master" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: cloning github repository
        uses: actions/checkout@v7.0.0

      - name: Setup username and password for docker
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build an image from Dockerfile
        run: docker build -t github-action-img .

      - name: Docker login
        run: docker login -u ${{ vars.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag the image
        run: docker tag github-action-img ${{ vars.DOCKER_USERNAME }}/github-action-img:v1

      - name: Push the image to dockerhub
        run: docker push ${{ vars.DOCKER_USERNAME }}/github-action-img:v1
          
      
